<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anas Cybersecurity Portfolio</title>
    <style>
        body { background-color: #0f172a; color: #38bdf8; font-family: monospace; padding: 40px; margin: 0; }
        h1 { border-bottom: 1px solid #38bdf8; padding-bottom: 10px; }
        .container { max-width: 800px; margin: 0 auto; }
        form { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; background: #0f172a; border: 1px solid #38bdf8; color: white; box-sizing: border-box; }
        input[type="file"] { background: #1e293b; border: 1px dashed #38bdf8; cursor: pointer; padding: 15px; }
        button { background: #38bdf8; color: #0f172a; padding: 10px 20px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #7dd3fc; }
        .project-card { background: #1e293b; padding: 15px; border-left: 4px solid #38bdf8; margin-bottom: 15px; position: relative; }
        .action-btns { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; cursor: pointer; font-size: 12px; }
        .edit-btn { background: #eab308; color: #0f172a; border: none; padding: 5px 10px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .admin-lock { border-bottom: 1px solid #38bdf8; padding-bottom: 15px; margin-bottom: 15px; }
        #cancelEditBtn { background: #64748b; margin-top: 10px; display: none; color: white; }
        .file-link { display: inline-block; margin-top: 10px; padding: 5px 10px; background: #0284c7; color: white; text-decoration: none; border-radius: 4px; font-size: 12px; }
        .file-link:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>anascyber.site // Security Terminal</h1>
        
        <form id="projectForm">
            <div class="admin-lock">
                <input type="password" id="adminPass" placeholder="Admin Password (Required for actions)" required>
            </div>
            <h3 id="formTitle">Add New Security Log / Write-up</h3>
            <input type="text" id="title" placeholder="Log Title" required>
            <select id="category">
                <option value="CTF Write-up">CTF Write-up</option>
                <option value="Security+ Notes">Security+ Notes</option>
                <option value="University Project">University Project</option>
                <option value="Vulnerability Research">Vulnerability Research</option>
            </select>
            <textarea id="description" rows="4" placeholder="Description of the methodology or notes..." required></textarea>
            
            <!-- File Upload Section -->
            <input type="file" id="fileUpload" accept="image/*,.pdf,.txt">
            
            <button type="submit" id="submitBtn">UPLOAD TO DATABASE</button>
            <button type="button" id="cancelEditBtn" onclick="cancelEdit()">CANCEL EDIT</button>
        </form>

        <h2>// Database Records</h2>
        <div id="projectsList">Loading records...</div>
    </div>

    <script>
        let editingId = null; 

        async function fetchProjects() {
            const res = await fetch('/api/projects');
            const projects = await res.json();
            const list = document.getElementById('projectsList');
            list.innerHTML = '';
            
            if (projects.length === 0) list.innerHTML = '<p>No records found in database.</p>';

            projects.forEach(p => {
                const safeTitle = p.title.replace(/'/g, "\\'");
                const safeDesc = p.description.replace(/'/g, "\\'");
                
                // If a file exists in the database, create a download button!
                let fileHTML = '';
                if (p.fileData && p.fileName) {
                    fileHTML = `<a href="${p.fileData}" download="${p.fileName}" class="file-link">📎 Download Attachment: ${p.fileName}</a>`;
                }

                list.innerHTML += `
                    <div class="project-card">
                        <div class="action-btns">
                            <button class="edit-btn" onclick="startEdit('${p._id}', '${safeTitle}', '${p.category}', '${safeDesc}')">EDIT</button>
                            <button class="delete-btn" onclick="deleteProject('${p._id}')">DELETE</button>
                        </div>
                        <small>[${p.category}] - ${new Date(p.createdAt).toLocaleDateString()}</small>
                        <h2>${p.title}</h2>
                        <p>${p.description}</p>
                        ${fileHTML}
                    </div>
                `;
            });
        }

        async function deleteProject(id) {
            const pass = document.getElementById('adminPass').value;
            if (!pass) return alert("Please enter the Admin Password.");
            if (confirm('Are you sure you want to delete this log?')) {
                const res = await fetch(`/api/projects/${id}`, { method: 'DELETE', headers: { 'x-admin-pass': pass }});
                if (res.ok) fetchProjects(); else alert('Access Denied: Incorrect Password');
            }
        }

        function startEdit(id, title, category, description) {
            editingId = id;
            document.getElementById('title').value = title;
            document.getElementById('category').value = category;
            document.getElementById('description').value = description;
            document.getElementById('formTitle').innerText = "Edit Security Log";
            document.getElementById('submitBtn').innerText = "UPDATE RECORD";
            document.getElementById('submitBtn').style.background = "#eab308";
            document.getElementById('cancelEditBtn').style.display = "block";
            window.scrollTo(0, 0);
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('projectForm').reset();
            document.getElementById('formTitle').innerText = "Add New Security Log / Write-up";
            document.getElementById('submitBtn').innerText = "UPLOAD TO DATABASE";
            document.getElementById('submitBtn').style.background = "#38bdf8";
            document.getElementById('cancelEditBtn').style.display = "none";
        }

        // Helper function to read file as Base64 Text
        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            
            // Collect standard data
            const projectData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                description: document.getElementById('description').value
            };

            // Process File Upload if a file was selected!
            const fileInput = document.getElementById('fileUpload');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (file.size > 8000000) return alert("File is too large! Max size is 8MB.");
                projectData.fileName = file.name;
                projectData.fileData = await getBase64(file);
            }

            const url = editingId ? `/api/projects/${editingId}` : '/api/projects';
            const method = editingId ? 'PUT' : 'POST';

            document.getElementById('submitBtn').innerText = "UPLOADING...";

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'x-admin-pass': pass },
                body: JSON.stringify(projectData)
            });

            if (res.ok) {
                const savedPass = document.getElementById('adminPass').value;
                cancelEdit(); 
                document.getElementById('adminPass').value = savedPass;
                fetchProjects();
            } else {
                alert('Access Denied or Error Occurred');
                document.getElementById('submitBtn').innerText = "UPLOAD TO DATABASE";
            }
        });

        fetchProjects();
    </script>
</body>
</html>
